# Enable as .gitlab-ci.yml only after configuring an available GitLab runner.
# This template has not been run by a GitLab runner during local acceptance.
image: python:3.12-slim
stages: [test]
offline-acceptance:
  stage: test
  script:
    - python -m pip install -c requirements-tested.txt -e '.[dev]'
    - PYTHONDONTWRITEBYTECODE=1 python scripts/verify_offline.py --output-dir reports/ci-acceptance
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - reports/ci-acceptance/*.log
      - reports/ci-acceptance/acceptance.json
      - reports/ci-acceptance/delivery/summary.json
      - reports/ci-acceptance/delivery/summary.md
      - reports/ci-acceptance/delivery/features.csv
