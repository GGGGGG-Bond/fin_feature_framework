[project]
name = "fin-feature-framework"
version = "0.4.2"
description = "金融数据处理与特征工程框架：采集、清洗、特征生成与可追溯核验"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "lxml>=4.9",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
fin-feature = "fin_feature.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fin_feature*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "requires_network: 需要网络连接的测试（真实 API 爬取），CI 可用 -m 'not requires_network' 跳过",
]
