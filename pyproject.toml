[project]
name = "fin-feature-framework"
version = "0.1.0"
description = "金融数据处理与特征工程框架：爬取 → 存储 → 清洗 → 特征 → 回测"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "lxml>=4.9",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["fin_feature*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
