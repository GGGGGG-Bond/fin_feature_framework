name: Offline acceptance

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Linux Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      FIN_DEMO_NO_OPEN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - name: Install tested dependencies
        run: python -m pip install -c requirements-tested.txt -e '.[dev]'
      - name: Check installed dependencies
        run: python -m pip check
      - name: Offline regression and complete demo flows
        run: python scripts/verify_offline.py --output-dir acceptance
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-python-${{ matrix.python }}
          path: |
            acceptance/*.log
            acceptance/acceptance.json
          if-no-files-found: warn
          retention-days: 7
