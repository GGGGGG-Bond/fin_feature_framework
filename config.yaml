# 金融数据处理与特征工程框架 - 主配置

database:
  path: "data/finance.db"

crawler:
  base_url: "https://datacenter-web.eastmoney.com/api/data/v1/get"
  stock_list_url: "https://push2.eastmoney.com/api/qt/clist/get"
  page_size: 50
  timeout: 15
  min_interval: 1.5        # 请求最小间隔（秒），反爬频率控制
  max_retries: 3            # 单页最大重试次数
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
  referer: "https://data.eastmoney.com/"

# 爬取范围
crawl:
  stock_count: 50           # 爬取公司数量
  report_names:
    financial_indicator: "RPT_LICO_FN_CPD"
    income_statement: "RPT_DMSK_FN_INCOME"
    balance_sheet: "RPT_DMSK_FN_BALANCE"
  # 近 N 个报告期；不填则爬取公司全部历史
  recent_periods: 4

# 清洗规则
cleaning:
  # 异常值阈值：字段 -> [min, max]，超出范围置 NULL 并记日志
  outlier_thresholds:
    weightavg_roe: [-200.0, 200.0]
    gross_margin: [-100.0, 100.0]
    debt_asset_ratio: [0.0, 100.0]
    current_ratio: [0.0, 100.0]
    net_profit_margin: [-100.0, 100.0]
    bps: [-1000.0, 100000.0]
    total_operate_income: [-1.0e13, 1.0e13]
    parent_netprofit: [-1.0e13, 1.0e13]
    total_assets: [0.0, 1.0e14]
    total_liabilities: [0.0, 1.0e14]
    total_equity: [-1.0e13, 1.0e14]
  # 缺失值策略：drop=丢弃整条记录, zero=填0, keep=保留NULL
  missing_strategy:
    total_operate_income: drop
    parent_netprofit: drop
    total_assets: drop
    total_liabilities: drop
    weightavg_roe: keep
    gross_margin: keep
    bps: keep
    default: keep

# 特征
features:
  groups:
    - profitability
    - growth
    - solvency

# 回测
backtest:
  n_groups: 5
  # 收益代理：next_profit_yoy = 下一报告期净利润同比增速
  return_proxy: "next_profit_yoy"

# 日志
logging:
  level: "INFO"
  file: "logs/fin_feature.log"
