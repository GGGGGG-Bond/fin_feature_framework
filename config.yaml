# 金融数据处理与特征工程框架 - 主配置
# 配置版本：stage2b-v1

database:
  path: "data/finance.db"

crawler:
  base_url: "https://datacenter-web.eastmoney.com/api/data/v1/get"
  stock_list_url: "https://push2.eastmoney.com/api/qt/clist/get"
  page_size: 50
  timeout: 15
  min_interval: 1.5        # 请求最小间隔（秒），反爬频率控制
  max_retries: 3            # 单页最多 HTTP 尝试数（含首次请求）
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
  referer: "https://data.eastmoney.com/"

# 爬取范围
crawl:
  stock_count: 50           # 爬取公司数量
  report_names:
    financial_indicator: "RPT_LICO_FN_CPD"
    income_statement: "RPT_DMSK_FN_INCOME"
    balance_sheet: "RPT_DMSK_FN_BALANCE"
  # 近 N 个报告期；不填则爬取公司全部历史
  recent_periods: 4
  max_pages_per_unit: 1000  # 财务/股票发现的分页安全上限；截断即失败

# 原始 HTTP 响应证据；root 相对数据库所在目录解析
raw_store:
  root: null               # 默认数据库同目录下 raw/
  max_body_bytes: 33554432  # 单响应解压后上限：32 MiB

# 清洗规则（标准单位：小数为比例，金额为元）
# 定义版本：stage1-v1
cleaning:
  # 异常值阈值：字段 -> [min, max]，超出范围记日志并保留原计量
  # 阈值使用标准单位（小数）
  outlier_thresholds:
    weightavg_roe: [-2.0, 2.0]       # 加权 ROE，小数（-200% 到 200%）
    gross_margin: [-1.0, 1.0]         # 毛利率，小数（-100% 到 100%）
    debt_asset_ratio: [0.0, 2.0]      # 资产负债率，小数（允许超过 1）
    current_ratio: [0.0, 20.0]        # 流动比率，倍数
    net_profit_margin: [-10.0, 10.0]  # 净利率，小数
    bps: [-1000.0, 10000.0]           # 每股净资产，元
    total_operate_income: [-1.0e13, 1.0e13]
    parent_netprofit: [-1.0e13, 1.0e13]
    total_assets: [0.0, 1.0e14]
    total_liabilities: [0.0, 1.0e14]
    total_equity: [-1.0e13, 1.0e14]
  # 缺失值策略：drop=丢弃整条记录，zero=填 0，keep=保留 NULL
  missing_strategy:
    total_operate_income: drop
    parent_netprofit: drop
    total_assets: drop
    total_liabilities: drop
    weightavg_roe: keep
    gross_margin: keep
    bps: keep
    default: keep

# 特征
features:
  groups:
    - profitability
    - growth
    - solvency

# 盈利增长分组分析（保留backtest配置名称）
backtest:
  n_groups: 5
  # 盈利增长代理：next_profit_yoy = 下一报告期净利润同比增速
  # 注意：这是盈利增长分析代理，非投资收益回测
  return_proxy: "next_profit_yoy"

# 日志
logging:
  level: "INFO"
  file: "logs/fin_feature.log"
